<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *::before, *::after, * {
  box-sizing: border-box;
}

body {
  background-color: hsl(220, 95%, 15%);
  color: hsl(221, 88%, 90%);
  text-align: center;
  max-width: calc(100% - 200px);
}

.container {
  width: 500px;
  margin: 50px auto;
  padding: 25px;
  background-color: hsl(221, 88%, 22%);
  border-radius: 30px;
  box-shadow: 0 0 20px rgba(0,0,0,0.4);
  align-items: center;
}

.strength-meter {
  position: relative;
  height: 42px;
  width: 90%;
  border: 3px solid hsl(221, 88%, 57%);
  border-radius: 20px;
  margin: 0 auto;
  overflow: hidden;
}
.strength-meter::before {
  content: '';
  position: absolute;
  left: 0;
  height: 100%;
  width: calc(1% * var(--strength, 0));
  background-color: hsl(221, 88%, 67%);
  border-radius: 2rem;
  transition: width 200ms;
}

.input-password {
  margin-top: 1rem;
  width: 90%;
  padding: 15px 70px;
  background-color: hsl(221, 88%, 25%);
  color: white;
  border: 1px solid hsl(221, 88%, 57%);
  outline: none;
  text-align: center;
  border-radius: 20px;
  margin-bottom: 20px;
}

.input-password:focus {
  border-color: hsl(221, 88%, 70%);
}


.reasons > * {
  margin: 20px auto;
  padding: 15px 20px;
  width: 90%;
  background-color: hsl(221, 88%, 22%);
  border: 2px solid hsl(221, 88%, 57%);
  border-radius: 15px;
  text-align: center;
}

.container2 {
  width: 100%;
  padding: 15px;
  background-color: hsl(221, 88%, 18%);
  border-radius: 20px;
}

#suggestion-box {
  margin-top: 10px;
  padding: 12px;
  border-radius: 15px;
  background-color: hsl(221, 50%, 25%);
  color: #90caee;
}

</style>
<body>
    <div class="container">
  <h1>Check Password Strength Test</h1>
  <div class="strength-meter" id="strength-meter"></div>
  <input class="input-password" id="input-password" value="" type="text" placeholder="Enter Password (e.g. Jhon@123)" autofocus>
  <div class="container2">
  <div id="reasons" class="reasons"></div>
  <div id="suggestion-box" class="reasons" style="display: none;"></div>
</div>
</div>

</body>

<script>
const strengthMeter = document.getElementById('strength-meter')
const inputPassword = document.getElementById('input-password')
const reasonsC = document.getElementById('reasons')
const suggestionBox = document.getElementById('suggestion-box')

inputPassword.addEventListener('input', updateStrengthMeter)

function updateStrengthMeter() {
  const password = inputPassword.value

  if (password.length === 0) {
    strengthMeter.style.setProperty('--strength', 0)
    reasonsC.innerHTML = ''
    return
  }

  const weaknesses = calculatePasswordStrength(password)

  let strength = 100
  reasonsC.innerHTML = ''

  weaknesses.forEach(weakness => {
    if (!weakness) return

    strength -= weakness.deduction

    const messageElement = document.createElement('div')
    messageElement.innerText = weakness.message
    reasonsC.appendChild(messageElement)
  })

  strength = Math.max(0, Math.min(strength, 100))
  

  let label = ''
  if (strength < 40) label = 'Weak'
  else if (strength < 70) label = 'Medium'
  else label = 'Strong'

  const labelElement = document.createElement('div')
  labelElement.innerText = `Strength: ${label}`
  labelElement.style.fontWeight = 'bold'
  labelElement.style.marginBottom = '5px'
  reasonsC.prepend(labelElement)

  strengthMeter.style.setProperty('--strength', strength)
    if (strength < 40) {
    suggestionBox.style.display = "block"
    suggestionBox.innerText = "Suggested Strong Password: " + generateStrongPassword()
  } else {
    suggestionBox.style.display = "none"
  }
}

function calculatePasswordStrength(password) {
  const weaknesses = []

  weaknesses.push(commonPasswordWeakness(password)) 
  weaknesses.push(lengthWeakness(password))
  weaknesses.push(lowercaseWeakness(password))
  weaknesses.push(uppercaseWeakness(password))
  weaknesses.push(numberWeakness(password))
  weaknesses.push(specialCharactersWeakness(password))
  weaknesses.push(repeatCharactersWeakness(password))

  return weaknesses
}

function lengthWeakness(password) {
  const length = password.length

  if (length <= 5) {
    return {
      message: 'Your password is too short.',
      deduction: 40
    }
  }

  if (length <= 10) {
    return {
      message: 'Your password could be longer.',
      deduction: 15
    }
  }

  return null
}

function uppercaseWeakness(password) {
  return characterTypeWeakness(password, /[A-Z]/g, 'uppercase characters')
}

function lowercaseWeakness(password) {
  return characterTypeWeakness(password, /[a-z]/g, 'lowercase characters')
}

function numberWeakness(password) {
  return characterTypeWeakness(password, /[0-9]/g, 'numbers')
}

function specialCharactersWeakness(password) {
  return characterTypeWeakness(password, /[^0-9a-zA-Z\s]/g, 'special characters')
}

function characterTypeWeakness(password, regex, type) {
  const matches = password.match(regex) || []

  if (matches.length === 0) {
    return {
      message: `Your password has no ${type}`,
      deduction: 20
    }
  }

  if (matches.length < 2) {
    return {
      message: `Your password could use more ${type}`,
      deduction: 5
    }
  }

  return null
}

function repeatCharactersWeakness(password) {
  const matches = password.match(/(.)\1+/g)

  if (matches) {
    let repeatCount = 0

    matches.forEach(match => {
      repeatCount += match.length - 1
    })

    return {
      message: 'Your password has repeated characters',
      deduction: repeatCount * 5
    }
  }

  return null
}

function commonPasswordWeakness(password) {
  const common = ["123456", "password", "qwerty", "abc123"]

  if (common.includes(password.toLowerCase())) {
    return {
      message: "This is a very common password!",
      deduction: 50
    }
  }
}

function generateStrongPassword() {
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*"
  let password = ""

  for (let i = 0; i < 12; i++) {
    password += chars[Math.floor(Math.random() * chars.length)]
  }

  return password
}

</script>
</html>
